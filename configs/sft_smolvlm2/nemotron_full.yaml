# Stage 2 / "full" SFT: SmolVLM2-500M on the deduplicated Nemotron full split.
# Mirrors Pengfei's run_finetune_full_vlm.slurm fresh-start hyperparameters,
# adjusted to keep batch_size=4 (Pengfei uses batch=1 for memory headroom on
# pathologically large images; bs=4 trades that for higher throughput per step).
#
# Launch:
#   sbatch slurm/sft_smolvlm2_nemotron.slurm configs/sft_smolvlm2/nemotron_full.yaml
#
# To resume from a tier1 checkpoint, override:
#   model_name_or_path: checkpoints/smolvlm2-500m-nemotron-tier1/checkpoint-XXXX
# and consider lowering the LRs to the resume values noted below.

# ── Model ────────────────────────────────────────────────────────────────────
model_name_or_path: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
dtype: bfloat16
attn_implementation: sdpa

# ── Data ─────────────────────────────────────────────────────────────────────
train_jsonl: /home/Changdae/edge_vlm/nemotron_curation/results/manifests/nemotron_full_train.jsonl
nemotron_root: /home/pengfei/datasets/Nemotron-Image-Training-v3
val_frac: 0.01
smoke_limit: 0

# ── Per-group learning rates (Pengfei's fresh-start defaults) ────────────────
# Resume from a warm checkpoint? Halve these: lr_connector=5e-5, lr_text=2.5e-5,
# lr_vision=5e-6 (matches Pengfei's resume regime).
lr_connector: 1.0e-4   # nanoVLM: --lr-mp
lr_text:      5.0e-5   # nanoVLM: --lr-lm
lr_vision:    1.0e-5   # nanoVLM: --lr-vit

# ── Training (SFTConfig) ─────────────────────────────────────────────────────
output_dir: checkpoints/smolvlm2-500m-nemotron-full
num_train_epochs: 4                 # matches Pengfei's full target
per_device_train_batch_size: 4      # kept at 4 (Pengfei uses 1 for memory safety)
per_device_eval_batch_size: 4
gradient_accumulation_steps: 2      # effective batch = 4 * 2 * 40 = 320 (Pengfei's target)
gradient_checkpointing: true

learning_rate: 5.0e-5
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.03
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1

# ── Sequence / dataloader ────────────────────────────────────────────────────
# NOTE: max_length is forced to None inside the script (VLM truncation breaks
# the image-token count invariant — see sft_vlm.py for the same pattern).
dataloader_num_workers: 4           # Pengfei dials this back from 8 for the long run
dataloader_persistent_workers: true
dataloader_prefetch_factor: 2
dataloader_pin_memory: true
seed: 0

# ── Logging / eval / checkpoints ─────────────────────────────────────────────
logging_steps: 10
logging_first_step: true
eval_strategy: steps
eval_steps: 1000                    # Pengfei evaluates every 1000 on the full run
save_strategy: steps
save_steps: 2000
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
report_to: "none"     # set to "trackio" (after `pip install trackio`), "tensorboard", or "wandb" to enable
bf16: true
